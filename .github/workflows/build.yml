name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Compilar todo
        shell: pwsh
        run: ./build.ps1

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Instalar_Spotify_Local_Streamlabs
          path: dist/Instalar_Spotify_Local_Streamlabs.exe

      - name: Leer versión
        id: version
        shell: pwsh
        run: |
          $v = (Get-Content server/package.json | ConvertFrom-Json).version
          "tag=v$v" >> $env:GITHUB_OUTPUT

      # Publica (o actualiza) la Release vX.Y.Z en cada push a main o al crear un tag v*.
      # Para sacar una versión nueva basta con subir "version" en server/package.json.
      - name: Publicar Release
        if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Spotify Local para Streamlabs ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || steps.version.outputs.tag }}
          files: dist/Instalar_Spotify_Local_Streamlabs.exe
          generate_release_notes: true
