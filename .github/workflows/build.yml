name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Compilar todo
        shell: pwsh
        run: ./build.ps1

      - name: Subir instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Instalar_Spotify_Local_Streamlabs
          path: dist/Instalar_Spotify_Local_Streamlabs.exe

      - name: Publicar Release (solo en tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Instalar_Spotify_Local_Streamlabs.exe
          generate_release_notes: true
